# hyprlock.conf
# yo
$font = Momo Trust Display

general {
    hide_cursor = false
}

#animacji
animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# bg
background {
    monitor =
    path = screenshot
    blur_passes = 3
}

# clock
label {
    monitor =
    text = $TIME
    font_size = 72
    font_family = $font
    color = rgb(221, 228, 226)
    position = 0, 50
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 20
    font_family = $font
    color = rgb(190, 201, 199)
    position = 0, -10
    halign = center
    valign = center
}

# field for pass
input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0)
    outer_color = rgba(80d5d0ee) 45deg
    check_color = rgba(b1c9e8ee) 120deg
    fail_color = rgba(ffb4abee) 40deg
    font_color = rgb(128, 213, 208)
    fade_on_empty = false
    rounding = 68
    font_family = $font
    placeholder_text = Input ur password...
    fail_text = $PAMFAIL$FPRINTFAIL
    dots_spacing = 0.3
    position = 0, -100
    halign = center
    valign = center
}
