[general]
bars = 15
framerate = 30
autosens = 1
lower_cutoff_freq = 50
higher_cutoff_freq = 7000

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average

[smoothing]
noise_reduction = 20
